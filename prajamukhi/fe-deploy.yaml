apiVersion: apps/v1
kind: Deployment
metadata:
  name: prajamukhi-frontend
  namespace: prajamukhi
  labels:
    app: prajamukhi-frontend
    app.kubernetes.io/name: prajamukhi-frontend
    app.kubernetes.io/instance: prajamukhi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prajamukhi-frontend
  template:
    metadata:
      labels:
        app: prajamukhi-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: naveensasalu/prajamukhi-frontend:initial
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: prajamukhi-frontend-service
  namespace: prajamukhi
spec:
  selector:
    app: prajamukhi-frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
