# prajamukhi.com is the real domain (own Certificate in
# gateway-api/traefik-gateway.yaml, since it's not a *.kaayaka.in
# subdomain). mag.kaayaka.in is kept temporarily during cutover - remove
# once prajamukhi.com DNS/cert is confirmed working end-to-end.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prajamukhi-routes
  namespace: prajamukhi
spec:
  parentRefs:
    # No sectionName: this route needs to attach to the shared "https"
    # listener (for mag.kaayaka.in) AND the dedicated https-prajamukhi-*
    # listeners (for prajamukhi.com/www/a) - Gateway API auto-attaches to
    # every listener whose hostname intersects this route's hostnames below.
    - name: traefik-gateway
      namespace: traefik-system
  hostnames:
    - "prajamukhi.com"
    - "www.prajamukhi.com"
    - "a.prajamukhi.com"
    - "mag.kaayaka.in"
  rules:
    # PocketBase REST API, file downloads, and admin dashboard
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /_/
      backendRefs:
        - name: pocketbase-service
          port: 8090
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: X-Forwarded-Proto
                value: https
    # Frontend - catch-all
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: prajamukhi-frontend-service
          port: 3000
