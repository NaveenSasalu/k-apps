# Shared Traefik Gateway for all applications
# This creates the entry point that HTTPRoutes attach to
# Deploy this ONCE in the cluster (traefik-system namespace)

---
apiVersion: v1
kind: Namespace
metadata:
  name: traefik-system

---
# Gateway Class - tells K8s which controller handles this gateway
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: traefik
spec:
  controllerName: traefik.io/gateway-controller

---
# SAN certificate for all kaayaka.in hostnames (HTTP-01 challenge)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kaayaka-tls
  namespace: traefik-system
spec:
  secretName: kaayaka-tls
  issuerRef:
    name: letsencrypt-http
    kind: ClusterIssuer
  dnsNames:
    - kaayaka.in
    - www.kaayaka.in
    - of.kaayaka.in
    - re.kaayaka.in
    - maps.kaayaka.in
    - mnio.kaayaka.in
    - games.kaayaka.in

    - arg.kaayaka.in
    - graf.kaayaka.in
    - vault.kaayaka.in

    # Prajamukhi is temporarily served on this subdomain too, alongside its
    # own root domain below - remove once prajamukhi.com DNS/cert is
    # confirmed working end-to-end.
    - mag.kaayaka.in

---
# Separate certificate for Prajamukhi's own root domain: prajamukhi.com is
# not a *.kaayaka.in subdomain, so it can't join the SAN cert above.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: prajamukhi-tls
  namespace: traefik-system
spec:
  secretName: prajamukhi-tls
  issuerRef:
    name: letsencrypt-http
    kind: ClusterIssuer
  dnsNames:
    - prajamukhi.com
    - www.prajamukhi.com
    - a.prajamukhi.com

---
# Separate certificate for Prajakshara's own root domain: test.prajakshara.com
# is not a *.kaayaka.in subdomain, so it can't join the SAN cert above.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: prajakshara-tls
  namespace: traefik-system
spec:
  secretName: prajakshara-tls
  issuerRef:
    name: letsencrypt-http
    kind: ClusterIssuer
  dnsNames:
    - test.prajakshara.com

---
# The actual Gateway resource
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-gateway
  namespace: traefik-system
spec:
  gatewayClassName: traefik
  listeners:
    # HTTP listener - redirects to HTTPS
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    # HTTPS listener with TLS
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: kaayaka-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
    # Traefik's Gateway provider doesn't reliably SNI-select a second cert
    # stacked on the listener above (kaayaka-tls always won even for SNIs
    # only prajamukhi-tls covers) - dedicated listeners per hostname sidestep
    # that instead of relying on multi-cert SNI selection within one listener.
    - name: https-prajamukhi-apex
      protocol: HTTPS
      port: 443
      hostname: "prajamukhi.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: prajamukhi-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
    - name: https-prajamukhi-www
      protocol: HTTPS
      port: 443
      hostname: "www.prajamukhi.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: prajamukhi-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
    - name: https-prajamukhi-a
      protocol: HTTPS
      port: 443
      hostname: "a.prajamukhi.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: prajamukhi-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
    - name: https-prajakshara-test
      protocol: HTTPS
      port: 443
      hostname: "test.prajakshara.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: prajakshara-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All

---
# HTTP to HTTPS redirect
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: traefik-system
spec:
  parentRefs:
    - name: traefik-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
