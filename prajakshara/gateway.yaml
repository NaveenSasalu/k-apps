# test.prajakshara.com is its own root domain (not a *.kaayaka.in
# subdomain), so it gets its own Certificate and dedicated Gateway listener -
# see gateway-api/traefik-gateway.yaml and the Traefik multi-cert gotcha
# noted there.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prajakshara-routes
  namespace: prajakshara
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik-system
      sectionName: https-prajakshara-test
  hostnames:
    - "test.prajakshara.com"
  rules:
    # PocketBase REST API, file downloads, and admin dashboard
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /_/
      backendRefs:
        - name: pocketbase-service
          port: 8090
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: X-Forwarded-Proto
                value: https
    # Frontend - catch-all
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: prajakshara-frontend-service
          port: 3000
